<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="logo_bg_grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="text_grad" x1="120" y1="40" x2="420" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="logo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow & Shield -->
    <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#logo_bg_grad)" filter="url(#logo_glow)"/>
    <rect x="6.5" y="6.5" width="87" height="87" rx="24.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    
    <!-- Tactical Siren and Cross inside Icon -->
    <g transform="translate(26, 26)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M8 24h24M12 24V14a8 8 0 0 1 16 0v10" fill="rgba(255,255,255,0.18)"/>
      <path d="M5 8l3 3M35 8l-3 3M20 2v3"/>
      <path d="M6 30h28M12 24v6M28 24v6"/>
      <path d="M20 13v8M16 17h8" stroke-width="2"/>
    </g>
  </g>

  <!-- Typography Right -->
  <g transform="translate(125, 20)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="url(#text_grad)">
      BIOSCAOUT
    </text>

    <!-- Version & Status Pills -->
    <g transform="translate(235, 18)">
      <rect x="0" y="0" width="85" height="20" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="42.5" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fed7aa" text-anchor="middle">SWARM v3.0</text>
    </g>
    <g transform="translate(328, 18)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
      <text x="30" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">EN VUELO</text>
    </g>

    <!-- Subtitle / Tactical Descriptor -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12.5" letter-spacing="0.5" fill="#94a3b8">
      BIO-AUTONOMOUS SWARM COMMAND &amp; CONTROL
    </text>

    <!-- Operational Capabilities Footnote -->
    <text x="0" y="86" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="10.5" letter-spacing="0.2" fill="#64748b">
      SAR • Evasión Sub-Milisegundo &lt;50ms • D-FINE RT-DETR • ATAK/MAVLink
    </text>
  </g>
</svg>
