<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="drone_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Heading Triangle -->
  <polygon points="32,6 38,18 26,18" fill="#38bdf8" filter="url(#drone_glow)"/>
  <!-- Central Quadcopter Fuselage -->
  <circle cx="32" cy="32" r="7" fill="#060911" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="#f97316"/>
  <!-- Quadcopter Arms -->
  <line x1="18" y1="18" x2="46" y2="46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="46" x2="46" y2="18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rotors -->
  <circle cx="16" cy="16" r="6" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
  <circle cx="48" cy="16" r="6" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
  <circle cx="16" cy="48" r="6" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
  <circle cx="48" cy="48" r="6" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
</svg>
