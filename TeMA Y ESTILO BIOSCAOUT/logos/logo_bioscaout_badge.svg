<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="badge_bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="badge_glow" cx="60" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge_drop_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- External Tactical Ring -->
  <circle cx="60" cy="60" r="56" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="60" cy="60" r="52" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>

  <!-- Main Rounded Hexagon Badge -->
  <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#badge_bg)" filter="url(#badge_drop_shadow)"/>
  <rect x="13.5" y="13.5" width="93" height="93" rx="26.5" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
  <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#badge_glow)"/>

  <!-- Siren / Tactical Beacon Graphic -->
  <g transform="translate(36, 34)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Siren dome -->
    <path d="M10 28h28M14 28V16a10 10 0 0 1 20 0v12" fill="rgba(255,255,255,0.15)"/>
    <!-- Siren light rays -->
    <path d="M6 10l4 4M42 10l-4 4M24 2v4"/>
    <!-- Base mounting -->
    <path d="M8 34h32M14 28v6M34 28v6"/>
    <!-- Medical Rescue cross inside dome -->
    <path d="M24 16v8M20 20h8" stroke-width="2"/>
  </g>

  <!-- Corner Tactical Crosses -->
  <circle cx="24" cy="24" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="96" cy="24" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="24" cy="96" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="96" cy="96" r="1.5" fill="rgba(255,255,255,0.6)"/>
</svg>
